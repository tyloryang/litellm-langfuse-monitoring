# Nginx entrypoint for LiteLLM and Langfuse. TLS certificates are mounted read-only.
events { worker_connections 2048; }
http {
  log_format llm_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log llm_json;
  error_log /var/log/nginx/error.log warn;
  server_tokens off;
  client_max_body_size 32m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;
  proxy_buffering off;
  proxy_request_buffering on;
  proxy_http_version 1.1;

  limit_req_zone $binary_remote_addr zone=llm_api:20m rate=20r/s;

  server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
  }
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    location / {
      limit_req zone=llm_api burst=60 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_pass http://litellm:4000;
    }
  }
  # Prometheus only. Replace example IP with VM-02's real address.
  server {
    listen 9401;
    server_name _;
    allow 192.168.10.20;
    deny all;
    location = /metrics {
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://litellm:4000/metrics;
    }
    location = /metrics/ {
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://litellm:4000/metrics/;
    }
    location / { return 404; }
  }
  server {
    listen 8444 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://langfuse-web:3000;
    }
  }
}
