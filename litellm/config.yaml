model_list:
  - model_name: qwen-vllm
    litellm_params:
      model: openai/qwen-vllm
      api_base: http://10.0.0.11:8000/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: qwen-sglang
    litellm_params:
      model: openai/qwen-sglang
      api_base: http://10.0.0.12:30000/v1
      api_key: os.environ/SGLANG_API_KEY
  - model_name: qwen-strata
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_xxs
      api_base: http://10.0.0.13:8008/v1
      api_key: os.environ/STRATA_API_KEY
litellm_settings:
  callbacks:
    - prometheus
    - observability_callback.observability
  prometheus_emit_stream_label: true
  prometheus_metrics_max_series_per_metric: 5000
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Resolve forwarded IPs only through the callback's explicit trusted proxy list.
  use_x_forwarded_for: false
