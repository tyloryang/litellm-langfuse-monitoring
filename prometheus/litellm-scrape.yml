# Append jobs under existing prometheus.yml scrape_configs (not a standalone prometheus.yml)
# /metrics on LiteLLM may require a Bearer token. Mount a token file on VM-02.
- job_name: litellm
  scrape_interval: 15s
  metrics_path: /metrics
  authorization:
    type: Bearer
    credentials_file: /etc/prometheus/secrets/litellm_metrics_token
  static_configs:
    - targets: ["192.168.10.10:9401"]
      labels: {service: litellm, environment: production}
- job_name: vllm
  scrape_interval: 15s
  metrics_path: /metrics
  static_configs:
    - targets: ["10.0.0.11:8000"]
      labels: {engine: vllm, deployment: gpu-vm-01}
- job_name: sglang
  scrape_interval: 15s
  metrics_path: /metrics
  static_configs:
    - targets: ["10.0.0.12:30000"]
      labels: {engine: sglang, deployment: gpu-vm-02}
- job_name: gpu-dcgm
  scrape_interval: 15s
  metrics_path: /metrics
  static_configs:
    - targets: ["10.0.0.11:9400"]
      labels: {deployment: gpu-vm-01}
    - targets: ["10.0.0.12:9400"]
      labels: {deployment: gpu-vm-02}
    - targets: ["10.0.0.13:9400"]
      labels: {deployment: gpu-vm-03}
# Strata supports Prometheus via content negotiation or format=prometheus.
# Its native metrics include GPU, TTFT and a weighted mean-gap ITL histogram.
- job_name: strata
  scrape_interval: 5s
  metrics_path: /metrics
  params:
    format: [prometheus]
  authorization:
    type: Bearer
    credentials_file: /etc/prometheus/secrets/strata_api_key
  static_configs:
    - targets: ["10.0.0.13:8008"]
      labels: {engine: strata, deployment: gpu-vm-03}
- job_name: strata-extra
  scrape_interval: 5s
  static_configs:
    - targets: ["10.0.0.13:9402"]
      labels: {engine: strata, deployment: gpu-vm-03}
