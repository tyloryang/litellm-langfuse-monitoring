# Append this entry to existing scrape_configs.
- job_name: litellm-gateway
  scrape_interval: 15s
  metrics_path: /metrics
  authorization:
    type: Bearer
    credentials_file: /etc/prometheus/secrets/litellm_master_key
  static_configs:
    - targets: ['192.168.10.10:4000']
      labels:
        service: litellm
        environment: production
