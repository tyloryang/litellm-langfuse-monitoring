# Override for docker-compose.bf16.yml. Both files must be supplied, in order.
services:
  vllm:
    command:
      - /models/Qwen3.6-27B
      - --served-model-name
      - qwen3.6-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --dtype
      - bfloat16
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.90"
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "4096"
      - --enable-chunked-prefill
      - --enforce-eager
