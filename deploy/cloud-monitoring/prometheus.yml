global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording-rules.yml
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_metrics_token
    static_configs:
      - targets: ["litellm:4000"]
        labels: {service: litellm, environment: production}
  - job_name: strata
    scrape_interval: 5s
    metrics_path: /metrics
    params:
      format: [prometheus]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/strata_api_key
    static_configs:
      - targets: ["strata:8080"]
        labels: {engine: strata, deployment: cloud-a100}
  - job_name: strata-extra
    scrape_interval: 5s
    static_configs:
      - targets: ["strata-extra:9402"]
        labels: {engine: strata, deployment: cloud-a100}
