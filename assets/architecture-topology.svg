<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#15283d} .box{fill:#f2f7ff;stroke:#3468a3;stroke-width:2;rx:14}.head{font-size:24px;font-weight:bold}.body{font-size:18px}.arrow{stroke:#2465b5;stroke-width:3;fill:none;marker-end:url(#arr)}.metric{stroke:#23885d;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#arr2)}</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#2465b5"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#23885d"/></marker></defs>
<rect width="1500" height="800" fill="#fff"/><rect width="1500" height="70" fill="#173a70"/><text x="750" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="white">LiteLLM + Langfuse 离线生产监控拓扑</text>
<rect class="box" x="35" y="170" width="220" height="130"/><text class="head" x="145" y="210" text-anchor="middle">客户端 / API</text><text class="body" x="145" y="250" text-anchor="middle">HTTPS / OpenAI API</text>
<rect class="box" x="310" y="170" width="210" height="130"/><text class="head" x="415" y="210" text-anchor="middle">Nginx</text><text class="body" x="415" y="246" text-anchor="middle">IP / Request ID</text>
<rect class="box" x="585" y="100" width="360" height="310"/><text class="head" x="765" y="142" text-anchor="middle">VM-01 网关与追踪</text><rect class="box" x="615" y="170" width="300" height="80"/><text class="head" x="765" y="220" text-anchor="middle">LiteLLM Gateway</text><rect class="box" x="615" y="275" width="300" height="95"/><text class="head" x="765" y="312" text-anchor="middle">Langfuse Web / Worker</text><text class="body" x="765" y="345" text-anchor="middle">Postgres / ClickHouse / Redis / MinIO</text>
<rect class="box" x="1020" y="120" width="425" height="100"/><text class="head" x="1230" y="160" text-anchor="middle">VM-02 Prometheus（已有）</text><text class="body" x="1230" y="195" text-anchor="middle">LiteLLM / Engine / DCGM Metrics</text>
<rect class="box" x="1020" y="280" width="425" height="100"/><text class="head" x="1230" y="322" text-anchor="middle">VM-03 Grafana（已有）</text><text class="body" x="1230" y="353" text-anchor="middle">Token / TTFT / TPOT / GPU / KV</text>
<path class="arrow" d="M255 235 H310"/><path class="arrow" d="M520 235 H615"/><path class="arrow" d="M765 250 V275"/><path class="metric" d="M915 200 H1020"/><path class="metric" d="M1230 220 V280"/>
<rect class="box" x="80" y="500" width="400" height="160"/><text class="head" x="280" y="545" text-anchor="middle">GPU VM-01 · vLLM</text><text class="body" x="280" y="585" text-anchor="middle">OpenAI API /metrics</text><text class="body" x="280" y="625" text-anchor="middle">DCGM Exporter :9400</text>
<rect class="box" x="550" y="500" width="400" height="160"/><text class="head" x="750" y="545" text-anchor="middle">GPU VM-02 · SGLang</text><text class="body" x="750" y="585" text-anchor="middle">OpenAI API /metrics</text><text class="body" x="750" y="625" text-anchor="middle">DCGM Exporter :9400</text>
<rect class="box" x="1020" y="500" width="400" height="160"/><text class="head" x="1220" y="545" text-anchor="middle">GPU VM-03 · Strata</text><text class="body" x="1220" y="585" text-anchor="middle">OpenAI API / 自定义 Exporter</text><text class="body" x="1220" y="625" text-anchor="middle">DCGM Exporter :9400</text>
<path class="arrow" d="M680 410 V450 H280 V500"/><path class="arrow" d="M765 410 V500"/><path class="arrow" d="M850 410 V450 H1220 V500"/>
<path class="metric" d="M280 500 V470 H1030 V220"/><path class="metric" d="M750 500 V470"/><path class="metric" d="M1220 500 V380"/>
<text x="750" y="735" text-anchor="middle" font-size="20">实线：推理请求　　虚线：Prometheus 指标抓取　　Langfuse：请求级 Token / Trace / 成本</text>
<text x="750" y="770" text-anchor="middle" font-size="17">GPU / KV Cache 内部指标必须由推理引擎或 Exporter 提供；Strata 需验证适配</text>
</svg>